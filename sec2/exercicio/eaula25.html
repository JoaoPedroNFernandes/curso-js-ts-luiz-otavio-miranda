<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        const nome = prompt('Digite seu nome completo');
        document.body.innerHTML += `O seu nome é: ${nome} <br>`;
        document.body.innerHTML += `Seu nome tem Letras: ${nome.length}<br>`;
        document.body.innerHTML += `A segunda letra do seu nome é: ${nome[1]}  <br>`;
        document.body.innerHTML += `Qual o primeiro índice da letra o seu nome: ${nome.indexOf('o')} <br>`;
        document.body.innerHTML += `Qual o ultimo índice da letra o seu nome: ${nome.lastIndexOf('o')} <br>`;
        document.body.innerHTML += `As ultimas 3 letras do seu nome são: ${nome.slice(-3)}  <br>`;
        document.body.innerHTML += `As palavras do seu nome são: ${nome.split(' ')} <br>`
        document.body.innerHTML += `Seu nome com letras maiusculas: ${nome.toUpperCase()} <br>`;
        document.body.innerHTML += `Seu nome com letras minusculas: ${nome.toLowerCase()} <br>`;

        </script>
</body>
</html>
